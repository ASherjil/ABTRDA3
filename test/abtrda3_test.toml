# ABTRDA3 Ping-Pong Test Configuration
#
# Server and client each pick their own transport so a fast x86 box
# (intel_i210) can drive an ARM64 SoC (cadence_gem) and vice-versa.
#
# Valid transports: "packet_mmap" | "af_xdp" | "intel_i210" | "cadence_gem"

[general]
watchdog_sec     = 30
ether_type       = 0x88B5
frame_size       = 64
nic_tuner        = "off"        # "off" | "nfs_safe" (NFS boot) | "full" (dedicated LAN)
send_interval_us = 100                 # 0 = back-to-back, 1000 = 1ms (WR-like)
output           = ""

[server]
transport    = "cadence_gem"          # runs on cfc-865-mkdev16 (x86_64)
interface    = "end0"
driver       = "macb"                 # kernel driver to unbind for the PMD
mac          = "fc:0f:e7:1b:8b:55"
cpu_core     = 1
xdp_queue_id = 0

[client]
transport    = "cadence_gem"         # runs on cfd-865-mkdev50 (aarch64 Zynq UltraScale+)
interface    = "end0"
driver       = "macb"
mac          = "fc:0f:e7:1b:8b:55"
cpu_core     = 2
xdp_queue_id = 0
count        = 500             # overridable with --count

[packet_mmap]
block_size   = 4096
block_number = 512

[af_xdp]
umem_frame_size = 2048
frame_count     = 512
need_wakeup     = false


# ── MAC reference ─────────────────────────────────────────────────────────
# mkdev16: eno1=20:87:56:b6:6a:27  eno2=20:87:56:b6:33:67  eno3=20:87:56:b6:33:68
# mkdev30: eno1=d4:f5:27:2a:69:f1  eno2=d4:f5:27:2a:a9:59  eno3=d4:f5:27:2a:a9:58
# mkdev50: end0=fc:0f:e7:1b:8b:55
#
# ── Running ────────────────────────────────────────────────────────────────
# sudo ./abtrda3_test --server [--config ...]
# sudo ./abtrda3_test --client [--count N] [--config ...]
# sudo ./abtrda3_test --txgen  [--count N] [--config ...]
# sudo ./abtrda3_test --rxsink [--config ...]
# ./profile_hotpath.sh --no-perf
