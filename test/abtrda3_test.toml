# ABTRDA3 Test Configuration — rtserver (single-host benchmark bench)
#
# One file drives every mode:
#   sudo ./abtrda3_test --server  [--config ...]           # RTT reflector   (uses [server])
#   sudo ./abtrda3_test --client  [--config ...]            # RTT originator, time-bounded (uses [client])
#   sudo ./abtrda3_test --txgen   [--count N] [--config ...] # one-way Tx flood (uses [client])
#   sudo ./abtrda3_test --rxsink  [--config ...]            # one-way Rx sink  (uses [server])
#   sudo ./abtrda3_test --single  [--config ...]            # single-process one-way latency
#
# --single (SingleRecorder): Tx = [client] port, Rx = [server] port, both on THIS
# host and directly cabled to each other. Three SCHED_OTHER threads pinned to the
# [single_recorder] cores (Tx/Rx/Hist). client.transport MUST equal server.transport.
#
# Valid transports: "packet_mmap" | "af_xdp" | "dpdk" | "verbs"

[general]
watchdog_sec     = 30
ether_type       = 0x88B5
frame_size       = 64                 # MUST be >= 26 (14B eth hdr + 4B seq + 8B TSC stamp)
nic_tuner        = "off"              # "off" | "nfs_safe" | "full" (dedicated LAN)
send_interval_us = 0                  # 0 = saturate; >0 = paced (1000 = 1ms, WR-like)
output           = "single_latency.csv"  # SingleRecorder writes <output> + <output>.hist.csv ("" disables)

# ── Tx port (also RTT --client / --txgen) ───────────────────────────────────
[client]
transport    = "af_xdp"
interface    = "xxv0"                 # XXV710 port 0, i40e, PCI 02:00.0
driver       = ""                     # DPDK only: the port's kernel driver name (i40e/igc/mlx5_core); "" otherwise
mac          = "40:a6:b7:02:b3:10"
cpu_core     = 3                      # RTT --client hot (ping-pong) core; --single uses [single_recorder] cores
xdp_queue_id = 0
# DPDK binding model — EXPLICIT, mutually exclusive, both false = vfio-pci pass-through:
dpdk_bifurcated = false               # keep the kernel driver (mlx5-class); no vfio unbind
dpdk_afxdp_pmd  = false               # DPDK-over-AF_XDP via the net_af_xdp vdev
count         = 1000                  # --txgen burst length (overridable with --count); --client is time-based
duration_sec  = 60                    # --client RTT run length: 60 = smoke, 86400 = 24 h soak (+ ~warmup margin)
recorder_core = 4                     # --client histogram thread core; MUST differ from cpu_core

# ── Rx port (also RTT --server / --rxsink) ──────────────────────────────────
[server]
transport    = "af_xdp"
interface    = "xxv1"                 # XXV710 port 1, i40e, PCI 02:00.1
driver       = ""
mac          = "40:a6:b7:02:b3:11"
cpu_core     = 2
xdp_queue_id = 0
dpdk_bifurcated = false               # see [client] — same two DPDK binding-model flags
dpdk_afxdp_pmd  = false

# ── SingleRecorder (--single) ───────────────────────────────────────────────
# This is for advanced benchmarking, not recommended to use please ignore
[single_recorder]
hot_path_core           = 2           # Tx thread
rx_core                 = 3           # Rx thread   (must differ from tx + recorder)
benchmark_recorder_core = 4           # Hist thread
duration_sec            = 60
queue_capacity          = 1048576     # SPSC cycle-delta slots

# ── AF_XDP NAPI regime ──────────────────────────────────────────────────────
# ENABLE toggles only — the VALUES (defer_hard_irqs=2, gro_flush_timeout=200000ns,
# irq_suspend_timeout=20ms) are fixed in AFXDP.hpp. Both false => deferral OFF
# (re-arm inline, no busy-poll gap needed) = the low-latency default.
#   enable_irq_suspend implies deferral on (kernel 6.13+; needs defer+gro nonzero).
# (umem frame size / count / need_wakeup are compile-time template params on AFXDP<>.)
[af_xdp]
enable_deferral    = false
enable_irq_suspend = false

[packet_mmap]
block_size   = 4096
block_number = 512

# ── Other NIC pairs on rtserver (swap [client]/[server] interface+mac+driver) ─
# XXV710  (i40e, 25G SFP28):  xxv0 40:a6:b7:02:b3:10  <->  xxv1 40:a6:b7:02:b3:11   PCI 02:00.0/.1
# ConnectX-4 Lx (mlx5, 25G):  cx0  b8:83:03:9c:d4:5c  <->  cx1  b8:83:03:9c:d4:5d   PCI 01:00.0/.1
# I225-V  (igc, 2.5G RJ45):   enp6s0 f0:2f:74:b1:41:96 <-> enp7s0 f0:2f:74:b1:41:97 PCI 06:00.0 / 07:00.0
#
# Transport notes:
#   af_xdp  — Intel (i40e/igc) + mlx5. i40e busy-poll needs the patched driver.
#   dpdk    — driver = kernel driver name; binding model is EXPLICIT per role:
#             default = vfio unbind (i40e/igc), dpdk_bifurcated = true (mlx5, no
#             vfio), dpdk_afxdp_pmd = true (DPDK-over-AF_XDP vdev).
#   verbs   — mlx5 only (cx0/cx1); Intel NICs have no verbs provider.
#
# Cores: rtserver isolcpus=2-4, nohz_full=2-4, rcu_nocbs=2-4, irqaffinity=0,1.
